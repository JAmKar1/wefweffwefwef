{% extends 'base.html' %}
{% block title %}Редактирование пользователя — URUS{% endblock %}
{% block content %}
<h1 class="page-title">Редактирование пользователя</h1>
<p class="page-subtitle">Изменение логина, роли, пароля и блокировки учётной записи</p>

<div class="card">
    <form method="post" action="{{ url_for('edit_user', user_id=user['id']) }}">
        <div class="field">
            <label for="login">Логин</label>
            <input type="text" id="login" name="login" maxlength="64" value="{{ form.login }}" required autofocus>
        </div>
        <div class="field">
            <label for="password">Новый пароль (оставьте пустым, чтобы не менять)</label>
            <input type="password" id="password" name="password" minlength="5">
        </div>
        <div class="field">
            <label for="role">Роль</label>
            <select id="role" name="role">
                <option value="user" {{ 'selected' if form.role == 'user' }}>Сотрудник</option>
                <option value="admin" {{ 'selected' if form.role == 'admin' }}>Администратор</option>
                <option value="reader" {{ 'selected' if form.role == 'reader' }}>Читатель</option>
            </select>
        </div>
        <div class="field">
            <label>
                <input type="checkbox" name="is_blocked" value="1" {{ 'checked' if form.is_blocked }}>
                Учётная запись заблокирована
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Сохранить</button>
            <a href="{{ url_for('admin') }}" class="btn btn--ghost">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
