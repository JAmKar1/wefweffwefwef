{% extends 'base.html' %}
{% block title %}Регистрация — Премиум Моторс{% endblock %}
{% block content %}
<section class="section">
  <div class="container auth">
    <form method="post" class="panel auth__card">
      <h1>Регистрация</h1>
      <p class="muted">Аккаунт нужен, чтобы сохранять автомобили в избранное. Это бесплатно.</p>
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="field">
        <label for="name">Имя *</label>
        <input type="text" id="name" name="name" required minlength="2" value="{{ form.name }}" placeholder="Иван" autofocus>
      </div>
      <div class="field">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" required value="{{ form.email }}" placeholder="you@mail.ru">
      </div>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" value="{{ form.phone }}" placeholder="+7 900 000-00-00">
      </div>
      <div class="field">
        <label for="password">Пароль * (от 6 символов)</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <div class="field">
        <label for="password2">Повторите пароль *</label>
        <input type="password" id="password2" name="password2" required minlength="6">
      </div>
      <button class="btn btn--primary btn--block" type="submit">Создать аккаунт</button>
      <p class="muted small">Уже есть аккаунт? <a class="link" href="{{ url_for('login', next=request.args.get('next')) }}">Войти</a></p>
    </form>
  </div>
</section>
{% endblock %}
